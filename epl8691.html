<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel EnCuba</title>
<style>
body { font-family: system-ui, sans-serif; padding: 10px; background: #f4f4f4; }
.fuente { background: white; padding: 10px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #ccc; }
.nombre { font-size: 12px; font-weight: bold; word-break: break-all; margin-bottom: 8px; }
.botones { display: flex; gap: 5px; flex-wrap: wrap; }
button { padding: 6px 10px; border: none; border-radius: 5px; font-size: 12px; cursor: pointer; color: white; }
.oficial { background: green; }
.alternativa { background: red; }
.internacional { background: purple; }
.borrar { background: #ccc; color: black; }
</style>
</head>
<body>

<h3>Clasificar Fuentes</h3>
<div id="lista"></div>

<script>
const REPO = 'encubanoticias/encubanoticias.github.io';
const TOKEN_KEY = 'gh_token';

function getToken() {
  let t = localStorage.getItem(TOKEN_KEY);
  if (!t) {
    t = prompt("Pega tu token de GitHub:");
    if (t) localStorage.setItem(TOKEN_KEY, t.trim());
  }
  return t;
}

// Cargar fuentes al iniciar
async function cargar() {
  const token = getToken();
  if (!token) return;

  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data/fuentes.json`, {
      headers: { 'Authorization': 'token ' + token }
    });
    if (!res.ok) throw new Error("Error de token");
    
    const file = await res.json();
    const contenido = JSON.parse(decodeURIComponent(escape(atob(file.content))));
    
    if (!contenido.clasificaciones) contenido.clasificaciones = {};
    
    const lista = document.getElementById('lista');
    lista.innerHTML = '';
    
    contenido.semilla.forEach(url => {
      const actual = contenido.clasificaciones[url] || 'alternativa';
      
      const div = document.createElement('div');
      div.className = 'fuente';
      div.innerHTML = `
        <div class="nombre">${url}</div>
        <div class="botones">
          <button class="oficial" onclick="guardar('${url}', 'oficial')" style="opacity: ${actual === 'oficial' ? 1 : 0.4}">Oficial</button>
          <button class="alternativa" onclick="guardar('${url}', 'alternativa')" style="opacity: ${actual === 'alternativa' ? 1 : 0.4}">Alternativa</button>
          <button class="internacional" onclick="guardar('${url}', 'internacional')" style="opacity: ${actual === 'internacional' ? 1 : 0.4}">Internacional</button>
          <button class="borrar" onclick="eliminar('${url}')">Borrar</button>
        </div>
      `;
      lista.appendChild(div);
    });

    // Guardamos el objeto en una variable global para usarlo al guardar
    window.fuentesActuales = contenido;
    window.shaActual = file.sha;

  } catch (e) {
    document.getElementById('lista').innerHTML = `<p style="color:red">Error: ${e.message}. Revisa tu token.</p>`;
  }
}

async function guardar(url, tipo) {
  const token = getToken();
  window.fuentesActuales.clasificaciones[url] = tipo;
  
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data/fuentes.json`, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: 'Clasificar ' + url,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(window.fuentesActuales, null, 2)))),
      sha: window.shaActual
    })
  });
  
  if (res.ok) cargar(); else alert("Error al guardar");
}

async function eliminar(url) {
  const token = getToken();
  window.fuentesActuales.semilla = window.fuentesActuales.semilla.filter(x => x !== url);
  delete window.fuentesActuales.feeds[url];
  
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data/fuentes.json`, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: 'Eliminar ' + url,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(window.fuentesActuales, null, 2)))),
      sha: window.shaActual
    })
  });
  
  if (res.ok) cargar(); else alert("Error al guardar");
}

cargar();
</script>
</body>
